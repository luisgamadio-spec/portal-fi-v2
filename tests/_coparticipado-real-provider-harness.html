<!doctype html>
<!-- Test-only harness to load the full Coparticipado real-data-
     integration surface (adapter, real provider, real view-model,
     page/render logic) in isolation, for Real Data Integration
     Foundation Coparticipado Phase 2's automated tests. Not part of
     the product shell. window.NX_AUTH / window.NX_INTELLIGENCE_CONFIG
     are supplied by the test itself via add_init_script, mirroring how
     coparticipado.js reads them at call time. Lives directly under
     tests/ (not tests/fixtures/) so coparticipado.js's own
     loadFixtures() page-relative fetch ('tests/fixtures/coparticipado-
     fixtures.json') resolves the same way it does from the real
     product shell (portal-next-v2/index.html) -- same reasoning as
     Dashbi's own _dashbi-real-provider-harness.html. -->

<body>

     (xlsx-js-style + shared helper loaded ahead of the module script that
     uses them). -->

<script src="../assets/js/lib/xlsx-export-helper.js"></script>

</body></html>
