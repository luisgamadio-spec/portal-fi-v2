<!doctype html>
<!-- Test-only harness to load the full Dashbi real-data-integration
     surface (adapter, real provider, real view-model, page/render
     logic) in isolation, for Real Data Integration Foundation Dashbi
     Phase 2's automated tests. Not part of the product shell.
     window.NX_AUTH / window.NX_INTELLIGENCE_CONFIG are supplied by the
     test itself via add_init_script, mirroring how dashbi.js reads
     them at call time. Lives directly under tests/ (not tests/
     fixtures/) so dashbi.js's own loadFixtures() page-relative fetch
     ('tests/fixtures/dashbi-fixtures.json') resolves the same way it
     does from the real product shell (portal-next-v2/index.html). -->

     shared helper loaded ahead of the module script that uses them). -->

<script src="../assets/js/lib/xlsx-export-helper.js"></script>

<script src="../assets/js/adapters/dashbi-real-provider.js"></script>
<script src="../assets/js/adapters/dashbi-real-view-model.js"></script>
<script src="../assets/js/dashbi.js"></script>
</body></html>
