<!doctype html>
<!-- V2-UAT-03 -- Portal-wide profile visibility UAT harness.

     Test-only, never linked from index.html/shell.js/config/*.json --
     same established tests/_*-harness.html convention this repo already
     uses and the Human already approved for Salários (RH-5B:
     tests/_salarios-uat-harness.html/_salarios-uat-mock.js). This Wave
     generalizes that EXACT same technique from "one module, one
     dropdown" to "the whole Portal, six fixed named-profile direct
     links" -- real production index.html fetched as text and written
     into an iframe with <base href="../"> plus ONE injected mock
     <script> spliced in before the real scripts run, so every asset
     (CSS/JS/shell/modules/navigation/Brabus Intelligence/simulators/
     Salários/Atendimento F&I) is the exact real production file, byte-
     identical, never a visual clone. Zero change to index.html on disk.

     SECURITY (Section 5 of the brief): this ?uat=<key> query string is
     read ONLY by this dedicated harness file, which builds its OWN
     iframe injection -- it is never read by index.html/auth-core.js/
     shell.js in any way. Opening the REAL Portal directly
     (http://127.0.0.1:8080/index.html?uat=camile or any similar guess)
     has ZERO effect: normal auth/authorization behavior is completely
     unchanged, proven by tests/v2-uat-03-profile-uat-test.py's own
     dedicated security check. An unknown/missing ?uat value here shows
     a neutral "no scenario selected" screen -- fail-closed, never a
     default MASTER/elevated profile.

     V2-UAT-03B: nome/perfil/loja/status AND the per-profile
     allowedModuleIds below are now VERIFIED live data (a READ-ONLY
     Supabase audit of public.usuarios + public.permissoes_modulos,
     requested and confirmed by the Human), replacing this Wave's own
     earlier placeholder ('TODAS'/assumed module lists). Salários'
     OWN RPC data stays SYNTHETIC FIXTURE ONLY (reuses the existing,
     already-approved tests/_salarios-uat-fixtures.js verbatim) --
     every other module's own RPCs are intentionally NOT mocked, since
     this is a VISIBILITY/PERFIL UAT (which modules appear/hide per
     profile, with the REAL name/loja/departamento), not a full real-
     data integration. See tests/_v2-uat-03-profiles-mock.js and this
     Wave's own report for the exact matrix and module-id mapping. No
     credentials, no login form, no real employee password, no real
     Supabase project contacted, no Supabase write performed by this
     harness or the audit that informed it. -->
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2-UAT-03 — Homologação por Perfil (local, dados sintéticos)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; color: #e6e6e6; font-family: system-ui, sans-serif; }
  #uatBar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; background: #1a1300; border-bottom: 2px solid #caa200;
    font-size: 12.5px;
  }
  #uatBar .tag { font-weight: 700; color: #ffcf33; letter-spacing: .03em; text-transform: uppercase; }
  #uatBar .who { display: flex; flex-direction: column; line-height: 1.3; }
  #uatBar .who b { color: #fff; font-size: 13.5px; }
  #uatBar .who span { color: #caa96b; font-size: 11.5px; letter-spacing: .02em; }
  #uatBar .sep { color: #6b5a1f; }
  #uatBar select { font: inherit; font-size: 12.5px; padding: 5px 8px; border-radius: 6px; border: 1px solid #444; background: #111; color: #eee; }
  #uatBar .hint { color: #a89660; font-size: 11px; }
  #uatFrame { display: block; width: 100%; height: calc(100vh - 52px); border: 0; }
  #uatFrame[hidden] { display: none; }
  #uatEmpty { padding: 40px; font-size: 14px; color: #cfcfcf; max-width: 640px; }
  #uatEmpty code { background: #1c1c1c; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="uatBar">
  <span class="tag">V2-UAT-03 · Homologação por Perfil · local · dados sintéticos</span>
  <span class="sep">|</span>
  <div class="who" id="uatWho" hidden>
    <b id="uatWhoName"></b>
    <span id="uatWhoRole"></span>
  </div>
  <label class="hint">Trocar cenário:
    <select id="uatSelect">
      <option value="">— selecionar —</option>
      <option value="camile">Camile Beatriz Santos Sena — ANALISTA (Nações)</option>
      <option value="william">William Syade — VENDEDOR (Novos, Europa)</option>
      <option value="roberto">Roberto Wagner de Lima — VENDEDOR (Seminovos, Europa)</option>
      <option value="felipe">Felipe Alexandre Vitorino — GERENTE (Seminovos, Europa)</option>
      <option value="alex">Alex Fabian Galvao Donizeti — GERENTE (Novos, Bandeirantes)</option>
      <option value="rodrigo">Rodrigo Carriel de Oliveira — DIRETOR NOVOS (sem loja)</option>
    </select>
  </label>
</div>
<div id="uatEmpty" hidden>
  Nenhum cenário de homologação selecionado (<code>?uat=</code> ausente ou
  desconhecido). Escolha um cenário acima, ou use um dos 6 links diretos
  do relatório desta Wave.
</div>
<iframe id="uatFrame" title="Portal F&amp;I V2 (UAT por perfil, local)" hidden></iframe>
<script>
(function () {
  'use strict';

  // ============================================================
  // V2-UAT-03B -- names/perfil/loja/status AND allowedModuleIds below
  // are all VERIFIED live data (a read-only Supabase audit of public.
  // usuarios + public.permissoes_modulos, requested and confirmed by
  // the Human ahead of this correction), no longer a UAT assumption.
  // No Supabase write occurred to produce this -- the harness only
  // encodes what the audit already read.
  //
  // The 4 real per-perfil matrices (public.permissoes_modulos), each
  // permissionId proven against config/module-registry.json (not
  // assumed by name -- see this Wave's own report, Section 5):
  //   analiseScoreVendedores -> score (Análise de Score Vendedores)
  //   comissoes              -> salarios-comissoes (Salários & Comissões)
  //   coparticipadoPortal    -> coparticipado (Gestão de Coparticipados)
  //   dashbi                 -> dashbi (Análise Geral do Grupo)
  //   gestao                 -> gestao (Análise F&I do Grupo)
  //   simuladorCompleto      -> simulador-novos (Simulador de Novos)
  //   simuladorSeminovos     -> simulador-seminovos (Simulador de Seminovos)
  // painel-analista-fi/central-atendimento-fi/shell-admin/landing/
  // brabus-intelligence are NOT part of this matrix and never need to
  // appear in allowedModuleIds -- their gating is authMode-driven
  // (ANALISTA_OR_MASTER / MASTER_ONLY / MASTER_ONLY / LOGIN_REQUIRED /
  // SEPARATE_AUTHORITY respectively), preserved unchanged.
  var MATRIX = {
    ANALISTA: ['analiseScoreVendedores', 'comissoes', 'coparticipadoPortal', 'dashbi', 'gestao', 'simuladorCompleto', 'simuladorSeminovos'],
    GERENTE: ['analiseScoreVendedores', 'comissoes', 'coparticipadoPortal', 'dashbi', 'simuladorCompleto', 'simuladorSeminovos'], // gestao=false
    VENDEDOR: ['comissoes', 'dashbi', 'simuladorCompleto', 'simuladorSeminovos'], // analiseScoreVendedores=false, coparticipadoPortal=false, gestao=false
    // DIRETOR_NOVOS is the real DB matrix KEY (underscore-normalized) --
    // the actual usuario_logado_fi() perfil VALUE stays space-separated
    // ('DIRETOR NOVOS'), confirmed live and matching how salarios-
    // comissoes.js's own canSeeGestor() reads context.perfil
    // (String(ctx.perfil).indexOf('DIRETOR')===0) -- no new
    // normalization invented, this harness just encodes both forms
    // where each is real.
    DIRETOR_NOVOS: ['analiseScoreVendedores', 'comissoes', 'coparticipadoPortal', 'dashbi', 'simuladorCompleto', 'simuladorSeminovos'] // gestao=false
  };

  // loja/status are real, audited public.usuarios values -- Rodrigo's
  // loja is genuinely null (no store-specific assignment for this
  // DIRETOR row), preserved as null rather than a placeholder, per the
  // brief's own explicit instruction.
  var PROFILES = {
    camile: {
      nome: 'CAMILE BEATRIZ SANTOS SENA', perfil: 'ANALISTA', status: 'NOVOS/SEMINOVOS', loja: 'NACOES',
      roleLabel: 'ANALISTA · NACOES',
      allowedModuleIds: MATRIX.ANALISTA
    },
    william: {
      nome: 'WILLIAM SYADE', perfil: 'VENDEDOR', status: 'NOVOS', loja: 'EUROPA',
      roleLabel: 'VENDEDOR · NOVOS · EUROPA',
      allowedModuleIds: MATRIX.VENDEDOR
    },
    roberto: {
      nome: 'ROBERTO WAGNER DE LIMA', perfil: 'VENDEDOR', status: 'SEMINOVOS', loja: 'EUROPA',
      roleLabel: 'VENDEDOR · SEMINOVOS · EUROPA',
      allowedModuleIds: MATRIX.VENDEDOR
    },
    felipe: {
      nome: 'FELIPE ALEXANDRE VITORINO', perfil: 'GERENTE', status: 'SEMINOVOS', loja: 'EUROPA',
      roleLabel: 'GERENTE · SEMINOVOS · EUROPA',
      allowedModuleIds: MATRIX.GERENTE
    },
    alex: {
      nome: 'ALEX FABIAN GALVAO DONIZETI', perfil: 'GERENTE', status: 'NOVOS', loja: 'BANDEIRANTES',
      roleLabel: 'GERENTE · NOVOS · BANDEIRANTES',
      allowedModuleIds: MATRIX.GERENTE
    },
    rodrigo: {
      // VERIFIED format: the real perfil enum encodes DIRETOR + department
      // as ONE combined value ('DIRETOR NOVOS'/'DIRETOR SEMINOVOS'), not
      // two separate fields -- confirmed live (docs/MASTER-USERS-RPC-
      // CONTRACT-CAPTURE.md) and by salarios-comissoes.js's own
      // canSeeGestor() check (String(ctx.perfil).indexOf('DIRETOR')===0).
      nome: 'RODRIGO CARRIEL DE OLIVEIRA', perfil: 'DIRETOR NOVOS', status: 'NOVOS', loja: null,
      roleLabel: 'DIRETOR NOVOS · sem loja específica',
      allowedModuleIds: MATRIX.DIRETOR_NOVOS
    }
  };

  var match = /[?&]uat=([a-z]+)\b/.exec(location.search);
  var key = match ? match[1] : '';
  var scenario = PROFILES[key];

  document.getElementById('uatSelect').value = scenario ? key : '';
  document.getElementById('uatSelect').addEventListener('change', function (e) {
    var v = e.target.value;
    location.search = v ? ('?uat=' + v) : '';
  });

  if (!scenario) {
    document.getElementById('uatEmpty').hidden = false;
    return; // fail-closed: no iframe, no mock, no profile -- nothing loads.
  }

  var whoEl = document.getElementById('uatWho');
  whoEl.hidden = false;
  document.getElementById('uatWhoName').textContent = 'Visualizando como: ' + scenario.nome.toUpperCase();
  document.getElementById('uatWhoRole').textContent = scenario.roleLabel + ' — MODO DE HOMOLOGAÇÃO';

  function buildMockScript() {
    var payload = Object.assign({ key: key }, scenario);
    return '<script>window.__V2UAT03_PAYLOAD__ = ' + JSON.stringify(payload) + ';<' + '/script>' +
      '<script src="tests/_salarios-uat-fixtures.js"><' + '/script>' +
      '<script src="tests/_v2-uat-03-profiles-mock.js"><' + '/script>';
  }

  function loadFrame() {
    fetch('../index.html', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
      // Same 3 proven fixes as tests/_salarios-uat-harness.html (RH-5B/
      // RH-5B.2): strip the real Supabase CDN + real intelligence-
      // runtime-config.js script tags from the fetched STRING only
      // (never on disk) so our mock is never overwritten, and cache-bust
      // every real asset URL so a stale earlier-visit cache can't hide a
      // fresh change.
      html = html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/supabase-js[^>]*><\/script>\s*/, '');
      html = html.replace(/<script src="assets\/js\/intelligence-runtime-config\.js"><\/script>[\s\S]*?<\/script>\s*/, '');
      var cacheBust = 'v2uat03=' + Date.now();
      html = html.replace(/(src|href)="(assets\/[^"]+)"/g, function (m, attr, path) {
        return attr + '="' + path + (path.indexOf('?') === -1 ? '?' : '&') + cacheBust + '"';
      });
      var injected = html.replace('<head>', '<head><base href="../">' + buildMockScript());
      var frame = document.getElementById('uatFrame');
      frame.hidden = false;
      var doc = frame.contentDocument;
      doc.open();
      doc.write(injected);
      doc.close();
    });
  }

  loadFrame();
})();
</script>
</body></html>
