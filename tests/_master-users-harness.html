<!doctype html>
<!-- Test-only harness to load the Painel Master / Usuários surface
     (provider, view-model, page controller) in isolation, for Painel
     Master Phase 2A's automated tests. Not part of the product shell.
     window.NX_AUTH / window.NX_INTELLIGENCE_CONFIG are supplied by the
     test itself via add_init_script -- the route guard itself (MASTER
     allow / ANALISTA-VENDEDOR deny / no content flash) is tested
     separately, against the real shell/router/auth-core, in
     tests/master-admin-route-test.py; this harness tests only the
     Usuários module's own behavior once mounted. -->
<html><head><meta charset="utf-8">
<!-- Painel Master Phase PM-4B.4: the real design-system-2/tokens.css
     that index.html itself loads -- without it, --mod-surface-panel-2/
     --mod-border-strong etc. resolve to nothing, so the modal dialog
     paints with a transparent background here (a pure test-harness
     visual-fidelity gap, discovered while capturing screenshots of the
     Usuários detail modal; the real product always loads this file). -->
<link rel="stylesheet" href="../../design-system-2/tokens.css">
<!-- Painel Master Phase PM-5B: the real assets/css/shell.css that
     index.html itself loads -- without it, the portal-wide
     [hidden]{display:none!important} rule (the actual fix for
     #maNewUserBtn's own hidden-attribute bug) never applies here,
     making its regression test silently pass for the wrong reason
     (same class of harness-fidelity gap already found/fixed for
     tokens.css in PM-4B.4). -->
<link rel="stylesheet" href="../assets/css/shell.css">
<link rel="stylesheet" href="../assets/css/module-system.css">
<link rel="stylesheet" href="../assets/css/shell-admin.css">
</head>
<body>
<div id="maOutlet"></div>
<!-- Painel Master Phase PM-4B.3: the real #nxModalRoot (index.html/
     shell.css) that the Auditoria detail modal renders into -- without
     this, master-audit-provider.js's modal code would silently no-op
     in this harness (real product always has this element). -->
<div id="nxModalRoot" aria-hidden="true"></div>
<!-- Painel Master Phase PM-5C: the real xlsx-js-style bundle that
     index.html itself loads -- without it, `window.XLSX` is undefined
     and master-gestao-bases-view-model.js's gbReadSheet() throws
     immediately on every test that exercises real file parsing (same
     harness-fidelity gap already found/fixed for tokens.css/shell.css). -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js" integrity="sha384-OUW9euuUyxyHcAhTqbhI+Iyb8LMssXt/cpz0yXhs9UWG2/R/uaWdakx/4cfww7Vb" crossorigin="anonymous"></script>
<script src="../assets/js/adapters/master-users-provider.js"></script>
<script src="../assets/js/adapters/master-users-view-model.js"></script>
<script src="../assets/js/adapters/master-acessos-provider.js"></script>
<script src="../assets/js/adapters/master-acessos-view-model.js"></script>
<script src="../assets/js/adapters/master-audit-provider.js"></script>
<script src="../assets/js/adapters/master-audit-view-model.js"></script>
<script src="../assets/js/adapters/master-pendencias-provider.js"></script>
<script src="../assets/js/master-pendencias-view-model.js"></script>
<script src="../assets/js/adapters/master-gestao-bases-provider.js"></script>
<script src="../assets/js/master-gestao-bases-view-model.js"></script>
<script src="../assets/js/adapters/master-gestao-simuladores-provider.js"></script>
<script src="../assets/js/master-gestao-simuladores-view-model.js"></script>
<script src="../assets/js/adapters/master-config-provider.js"></script>
<script src="../assets/js/master-config-view-model.js"></script>
<script src="../assets/js/adapters/master-periodos-provider.js"></script>
<script src="../assets/js/master-periodos-view-model.js"></script>
<script src="../assets/js/shell-admin.js"></script>
</body></html>
